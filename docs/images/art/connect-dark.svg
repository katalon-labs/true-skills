<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 139" width="830" height="139" role="img" aria-label="The agent calls the Katalon MCP, signs in through the browser, picks a workspace, and gets the tools">
<title>The agent calls the Katalon MCP, signs in through the browser, picks a workspace, and gets the tools</title>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;font-size:20px;fill:#3fc495}
.m{fill:#93a29b}
.fr{opacity:0}
.f3{opacity:1}
@media (prefers-reduced-motion: no-preference){
.fr{animation-duration:3.20s;animation-timing-function:step-end;animation-iteration-count:infinite;animation-fill-mode:both}
@keyframes f0{0%{opacity:1}18.75%{opacity:0}100%{opacity:0}}
.f0{animation-name:f0}
@keyframes f1{0%{opacity:0}18.75%{opacity:1}37.5%{opacity:0}100%{opacity:0}}
.f1{animation-name:f1}
@keyframes f2{0%{opacity:0}37.5%{opacity:1}56.25%{opacity:0}100%{opacity:0}}
.f2{animation-name:f2}
@keyframes f3{0%{opacity:0}56.25%{opacity:1}100%{opacity:1}}
.f3{animation-name:f3}
}
@media (prefers-reduced-motion: reduce){.fr{animation:none;opacity:0}.f3{opacity:1}}
</style>
<rect x="0.5" y="0.5" width="829" height="138" rx="14" fill="#0f1513" stroke="#24302b"/>
<g class="fr f0"><text x="204" y="46.4" xml:space="preserve">[agent] --&gt; /mcp</text><text x="204" y="75.4" xml:space="preserve">            401 ?</text></g>
<g class="fr f1"><text x="204" y="46.4" xml:space="preserve">[agent] --&gt; /mcp</text><text x="204" y="75.4" xml:space="preserve">            [ browser: sign in ]</text><text x="204" y="104.4" xml:space="preserve">            pick workspace: [v]</text></g>
<g class="fr f2"><text x="204" y="46.4" xml:space="preserve">[agent] &lt;-- oauth</text><text x="204" y="75.4" xml:space="preserve">            <tspan class="m">no keys to paste</tspan></text></g>
<g class="fr f3"><text x="204" y="46.4" xml:space="preserve">[agent] &lt;-- tools</text><text x="204" y="75.4" xml:space="preserve">            <tspan class="m">platform.katalon.io/mcp</tspan></text><text x="204" y="104.4" xml:space="preserve">            connected  [ ok ]</text></g>
</svg>
