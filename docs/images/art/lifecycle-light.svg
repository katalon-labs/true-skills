<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 139" width="830" height="139" role="img" aria-label="A marker walks the seven lifecycle stages, then maintenance sends a gap list back to planning">
<title>A marker walks the seven lifecycle stages, then maintenance sends a gap list back to planning</title>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;font-size:20px;fill:#0f8461}
.m{fill:#5b6661}
.fr{opacity:0}
.f7{opacity:1}
@media (prefers-reduced-motion: no-preference){
.fr{animation-duration:5.60s;animation-timing-function:step-end;animation-iteration-count:infinite;animation-fill-mode:both}
@keyframes f0{0%{opacity:1}10.714%{opacity:0}100%{opacity:0}}
.f0{animation-name:f0}
@keyframes f1{0%{opacity:0}10.714%{opacity:1}21.429%{opacity:0}100%{opacity:0}}
.f1{animation-name:f1}
@keyframes f2{0%{opacity:0}21.429%{opacity:1}32.143%{opacity:0}100%{opacity:0}}
.f2{animation-name:f2}
@keyframes f3{0%{opacity:0}32.143%{opacity:1}42.857%{opacity:0}100%{opacity:0}}
.f3{animation-name:f3}
@keyframes f4{0%{opacity:0}42.857%{opacity:1}53.571%{opacity:0}100%{opacity:0}}
.f4{animation-name:f4}
@keyframes f5{0%{opacity:0}53.571%{opacity:1}64.286%{opacity:0}100%{opacity:0}}
.f5{animation-name:f5}
@keyframes f6{0%{opacity:0}64.286%{opacity:1}75%{opacity:0}100%{opacity:0}}
.f6{animation-name:f6}
@keyframes f7{0%{opacity:0}75%{opacity:1}100%{opacity:1}}
.f7{animation-name:f7}
}
@media (prefers-reduced-motion: reduce){.fr{animation:none;opacity:0}.f7{opacity:1}}
</style>
<rect x="0.5" y="0.5" width="829" height="138" rx="14" fill="#f6f8f7" stroke="#e2e7e4"/>
<g class="fr f0"><text x="72" y="46.4" xml:space="preserve">[plan]-[design]-[manage]-[review]-[run]-[analyze]-[maint]</text><text x="72" y="75.4" xml:space="preserve">   ^</text><text x="72" y="104.4" xml:space="preserve"><tspan class="m">test-plan</tspan></text></g>
<g class="fr f1"><text x="72" y="46.4" xml:space="preserve">[plan]-[design]-[manage]-[review]-[run]-[analyze]-[maint]</text><text x="72" y="75.4" xml:space="preserve">           ^</text><text x="72" y="104.4" xml:space="preserve">   <tspan class="m">create-test-cases</tspan></text></g>
<g class="fr f2"><text x="72" y="46.4" xml:space="preserve">[plan]-[design]-[manage]-[review]-[run]-[analyze]-[maint]</text><text x="72" y="75.4" xml:space="preserve">                    ^</text><text x="72" y="104.4" xml:space="preserve">             <tspan class="m">test-management</tspan></text></g>
<g class="fr f3"><text x="72" y="46.4" xml:space="preserve">[plan]-[design]-[manage]-[review]-[run]-[analyze]-[maint]</text><text x="72" y="75.4" xml:space="preserve">                             ^</text><text x="72" y="104.4" xml:space="preserve">                        <tspan class="m">test-review</tspan></text></g>
<g class="fr f4"><text x="72" y="46.4" xml:space="preserve">[plan]-[design]-[manage]-[review]-[run]-[analyze]-[maint]</text><text x="72" y="75.4" xml:space="preserve">                                    ^</text><text x="72" y="104.4" xml:space="preserve">                              <tspan class="m">execute-test</tspan></text></g>
<g class="fr f5"><text x="72" y="46.4" xml:space="preserve">[plan]-[design]-[manage]-[review]-[run]-[analyze]-[maint]</text><text x="72" y="75.4" xml:space="preserve">                                            ^</text><text x="72" y="104.4" xml:space="preserve">                                     <tspan class="m">release-analyze</tspan></text></g>
<g class="fr f6"><text x="72" y="46.4" xml:space="preserve">[plan]-[design]-[manage]-[review]-[run]-[analyze]-[maint]</text><text x="72" y="75.4" xml:space="preserve">                                                     ^</text><text x="72" y="104.4" xml:space="preserve">                                         <tspan class="m">test-maintenance</tspan></text></g>
<g class="fr f7"><text x="72" y="46.4" xml:space="preserve">[plan]-[design]-[manage]-[review]-[run]-[analyze]-[maint]</text><text x="72" y="75.4" xml:space="preserve">   ^                                                 |</text><text x="72" y="104.4" xml:space="preserve">   +-&lt;------------- gaps back to plan -------------&lt;-+</text></g>
</svg>
