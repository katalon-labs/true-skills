<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7a8699"/>
    </marker>
    <style>
      .h { fill:#0f172a; font-weight:700; }
      .sub { fill:#64748b; }
      .card { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
      .skill { fill:#475569; font-size:12px; }
      .agent { fill:#0f172a; font-size:13px; font-weight:600; }
      .pill { fill:#f1f5f9; stroke:#e2e8f0; stroke-width:1; }
      .teal { fill:#00A3A3; }
      .tealcard { fill:#e6f7f7; stroke:#00A3A3; stroke-width:1.5; }
      .edge { stroke:#94a3b8; stroke-width:1.5; fill:none; }
      .white { fill:#ffffff; }
    </style>
  </defs>

  <rect width="1040" height="600" fill="#f8fafc"/>

  <!-- title -->
  <text x="40" y="48" class="h" font-size="26">Katalon True Platform - one skill source, every agent</text>
  <text x="40" y="74" class="sub" font-size="14">Author skills once. A build script generates native config for each AI coding agent. All connect to the same Katalon MCP.</text>

  <!-- 1. canonical skills -->
  <rect x="40" y="110" width="240" height="300" rx="12" class="card"/>
  <text x="60" y="140" class="h" font-size="15">skills/</text>
  <text x="60" y="158" class="sub" font-size="11">single source of truth</text>
  <g class="skill">
    <text x="60" y="190">• platform-setup</text>
    <text x="60" y="214">• create-test-cases</text>
    <text x="60" y="238">• execute-test</text>
    <text x="60" y="262">• upload-report</text>
    <text x="60" y="286">• test-case → playwright</text>
    <text x="60" y="310">• playwright-execute</text>
    <text x="60" y="334">• release-analyze</text>
    <text x="60" y="358">• trueplatform-testing</text>
  </g>
  <text x="60" y="390" class="teal" font-size="11" font-weight="600">SKILL.md + references/</text>

  <!-- arrow to build -->
  <path d="M280 260 L320 260" class="edge" marker-end="url(#arrow)"/>

  <!-- 2. build script -->
  <rect x="322" y="222" width="150" height="76" rx="12" class="tealcard"/>
  <text x="397" y="252" text-anchor="middle" class="h" font-size="13">build-adapters</text>
  <text x="397" y="270" text-anchor="middle" class="sub" font-size="11">scripts/*.mjs</text>
  <text x="397" y="286" text-anchor="middle" class="sub" font-size="10">deterministic</text>

  <!-- arrow to agents -->
  <path d="M472 260 L512 260" class="edge" marker-end="url(#arrow)"/>

  <!-- 3. agents grid -->
  <rect x="514" y="110" width="486" height="300" rx="12" class="card"/>
  <text x="534" y="140" class="h" font-size="15">Native config per agent</text>
  <g>
    <!-- row 1 -->
    <rect x="534" y="156" width="142" height="50" rx="8" class="pill"/>
    <text x="605" y="180" text-anchor="middle" class="agent">Claude Code</text>
    <text x="605" y="196" text-anchor="middle" class="skill" font-size="10">plugin marketplace</text>

    <rect x="686" y="156" width="142" height="50" rx="8" class="pill"/>
    <text x="757" y="180" text-anchor="middle" class="agent">Codex</text>
    <text x="757" y="196" text-anchor="middle" class="skill" font-size="10">plugin + openai.yaml</text>

    <rect x="838" y="156" width="142" height="50" rx="8" class="pill"/>
    <text x="909" y="180" text-anchor="middle" class="agent">Copilot</text>
    <text x="909" y="196" text-anchor="middle" class="skill" font-size="10">.github/prompts</text>

    <!-- row 2 -->
    <rect x="534" y="216" width="142" height="50" rx="8" class="pill"/>
    <text x="605" y="240" text-anchor="middle" class="agent">Cursor</text>
    <text x="605" y="256" text-anchor="middle" class="skill" font-size="10">.cursor/rules</text>

    <rect x="686" y="216" width="142" height="50" rx="8" class="pill"/>
    <text x="757" y="240" text-anchor="middle" class="agent">Kiro</text>
    <text x="757" y="256" text-anchor="middle" class="skill" font-size="10">.kiro/steering</text>

    <rect x="838" y="216" width="142" height="50" rx="8" class="pill"/>
    <text x="909" y="240" text-anchor="middle" class="agent">Windsurf</text>
    <text x="909" y="256" text-anchor="middle" class="skill" font-size="10">.windsurf/rules</text>

    <!-- row 3 -->
    <rect x="534" y="276" width="142" height="50" rx="8" class="pill"/>
    <text x="605" y="300" text-anchor="middle" class="agent">Cline</text>
    <text x="605" y="316" text-anchor="middle" class="skill" font-size="10">.clinerules</text>

    <rect x="686" y="276" width="142" height="50" rx="8" class="pill"/>
    <text x="757" y="300" text-anchor="middle" class="agent">Continue</text>
    <text x="757" y="316" text-anchor="middle" class="skill" font-size="10">.continue/rules</text>

    <rect x="838" y="276" width="142" height="50" rx="8" class="pill"/>
    <text x="909" y="300" text-anchor="middle" class="agent">Any agent</text>
    <text x="909" y="316" text-anchor="middle" class="skill" font-size="10">AGENTS.md</text>
  </g>
  <text x="534" y="358" class="sub" font-size="11">Each adapter is self-contained and points at the same Katalon MCP server.</text>
  <text x="534" y="378" class="sub" font-size="11">Regenerate any time with one command - never edit generated files by hand.</text>

  <!-- connectors from agents block to MCP -->
  <path d="M757 410 L757 446" class="edge" marker-end="url(#arrow)"/>

  <!-- 4. MCP -->
  <rect x="514" y="448" width="486" height="56" rx="12" class="tealcard"/>
  <text x="757" y="472" text-anchor="middle" class="h" font-size="14">Katalon MCP server</text>
  <text x="757" y="492" text-anchor="middle" class="sub" font-size="11">npx mcp-remote https://&lt;your.sub.domain&gt;.katalon.io/mcp  ·  browser OAuth</text>

  <!-- arrow to platform -->
  <path d="M757 504 L757 532" class="edge" marker-end="url(#arrow)"/>

  <!-- 5. platform -->
  <rect x="514" y="534" width="486" height="44" rx="12" class="teal"/>
  <text x="757" y="561" text-anchor="middle" class="white" font-size="14" font-weight="700">Katalon True Platform · requirements → tests → Run with AI → reports</text>

  <!-- left flow caption -->
  <rect x="40" y="448" width="440" height="130" rx="12" class="card"/>
  <text x="60" y="476" class="h" font-size="14">What you get</text>
  <text x="60" y="500" class="skill">Requirement-to-execution testing, driven from chat:</text>
  <text x="60" y="522" class="skill">analyze reqs → design ISTQB cases → import + link →</text>
  <text x="60" y="544" class="skill">build suite → Run with AI → upload reports → release call.</text>
  <text x="60" y="568" class="teal" font-size="11" font-weight="600">8 skills · 8 agents · 1 MCP</text>
</svg>
