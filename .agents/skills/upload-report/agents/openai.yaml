interface:
  display_name: "Katalon Upload Report"
  short_description: "Upload and verify Katalon reports"
  default_prompt: "Use $upload-report to upload a Katalon, JUnit, or Playwright report to Katalon Platform and summarize results."
dependencies:
  tools:
    - type: "mcp"
      value: "katalon-prod-mcp"
      description: "Katalon True Platform MCP server"
      transport: "streamable_http"
      url: "https://platform.katalon.io/mcp"
