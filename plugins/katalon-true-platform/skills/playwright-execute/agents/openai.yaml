interface:
  display_name: "Katalon Playwright Execute"
  short_description: "Run Playwright and upload Katalon reports"
  default_prompt: "Use $playwright-execute to run a Playwright suite, upload the report to Katalon Platform, and verify the uploaded result."
dependencies:
  tools:
    - type: "mcp"
      value: "katalon-prod-mcp"
      description: "Katalon True Platform MCP server"
      transport: "streamable_http"
      url: "https://platform.katalon.io/mcp"
