name: build-check

# Verifies that the generated agent adapters are in sync with skills/.
# If someone edited a skill (or a generated file) without rebuilding, the
# working tree changes and this job fails.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  adapters-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skills against skills.config.mjs
        run: node scripts/validate-skills.mjs
      - name: Regenerate adapters from skills/
        run: node scripts/build-adapters.mjs
      - name: Fail if generated files are out of sync
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of sync. Run 'node scripts/build-adapters.mjs' and commit the result."
            exit 1
          fi

  chatgpt-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fixture tests for the ChatGPT package build
        run: python3 -m unittest discover -s tests
      - name: Build and validate the ChatGPT plugin package
        run: python3 scripts/build-chatgpt-plugin.py
